<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-Verse - Home of Comics</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo">WEB-VERSE</a>
            <nav class="main-nav desktop-nav">
                <ul>
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="all-comics.html">All Comics</a></li>
                    <li><a href="genres.html">Genres</a></li>
                </ul>
            </nav>
            <div class="search-bar">
                <input type="text" placeholder="Search..." onkeydown="if(event.keyCode===13) window.location.href='all-comics.html?search='+this.value">
                <button type="submit" onclick="window.location.href='all-comics.html?search='+this.previousElementSibling.value">Search</button>
            </div>
            <button id="mobile-menu-toggle" class="mobile-menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
        <nav id="mobile-nav" class="mobile-nav">
            <a href="index.html">Home</a>
            <a href="all-comics.html">All Comics</a>
            <a href="genres.html">Genres</a>
        </nav>
    </header>

    <main class="main-content">
        <div class="container">
            <section id="featured-section" class="featured-section"></section>
            <section class="comic-showcase">
                <h2>Latest Updates</h2>
                <div id="latest-updates-grid" class="comic-grid"></div>
            </section>
            <section class="comic-showcase">
                <h2>Popular This Week</h2>
                <div id="popular-comics-list" class="popular-grid"></div>
            </section>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2026 Web-Verse. All rights reserved.</p>
            <div class="footer-links">
                <a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a> | <a href="#">Contact Us</a>
            </div>
        </div>
    </footer>

    <a href="#" id="back-to-top" class="back-to-top-btn">▲</a>
    <script src="script.js"></script>
</body>
</html>
